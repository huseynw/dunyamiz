name: Send Scheduled Notifications

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call notification function
        run: |
          curl -X POST https://dunyamiz.me/.netlify/functions/send-notifications \
            -H "Content-Type: application/json" \
            -d '{"secret":"${{ secrets.CRON_SECRET }}"}'
